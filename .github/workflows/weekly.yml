name: Weekly Electronics Update

'on':
  schedule:
    - cron: '0 23 * * 0'
    - cron: '50 0 22 10 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Gate the one-time test schedule
        id: schedule_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_CRON" == "50 0 22 10 *" && "$(date -u +%F)" != "2026-10-22" ]]; then
            echo "run_update=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        if: steps.schedule_gate.outputs.run_update == 'true'
        uses: actions/checkout@v4

      - name: Setup Python
        if: steps.schedule_gate.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Deep search and article curation
        if: steps.schedule_gate.outputs.run_update == 'true'
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
        run: python scripts/update_weekly.py

      - name: Commit weekly data
        if: steps.schedule_gate.outputs.run_update == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weekly.json data/archive.json
          if git diff --cached --quiet; then
            echo "No weekly data changes"
          else
            git commit -m "chore: weekly electronics update"
            git push
          fi
