<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUROM Electronics Weekly</title><style>:root{--n:#0b203d;--b:#2563eb;--bg:#f4f7fb;--i:#14213d;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Arial,"Noto Sans KR",sans-serif}.w{max-width:1200px;margin:auto;padding:0 22px}header{position:sticky;top:0;z-index:9;background:var(--n);color:#fff}.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800}.brand span{color:#79deb9}.menu{display:flex;gap:5px;overflow:auto}.menu button{border:0;background:transparent;color:#d8e2f0;padding:10px;border-radius:8px;font-weight:700;white-space:nowrap;cursor:pointer}.menu button.active{background:#ffffff18;color:#fff}.hero{background:linear-gradient(135deg,#0b203d,#174678 70%,#15715f);color:#fff;padding:48px 0}.hero h1{font-size:clamp(31px,5vw,57px);margin:8px 0}.hero p{color:#d9e4f0}.chips{display:flex;gap:8px;margin-top:18px}.chip{border:1px solid #ffffff38;border-radius:999px;padding:7px 11px;font-size:12px}section{padding:35px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e4e9f1;border-radius:18px;padding:21px;box-shadow:0 5px 20px #132a4420}.tag{display:inline-block;background:#e8efff;color:#2455ba;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850}.rating{float:right;color:#df9700}.card h3{font-size:18px;line-height:1.42;margin:13px 0 8px}.meta{font-size:12px;color:#8a94a4}.summary{color:#536176;font-size:14px;line-height:1.65;margin:15px 0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;line-clamp:6;overflow:hidden}.keywords{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0 17px}.kw{background:#f0f5ff;color:#2455ba;border:1px solid #d9e5ff;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.card a{color:var(--b);font-size:13px;font-weight:750}.empty{grid-column:1/-1;background:#fff;padding:30px;text-align:center}.sourceType{color:#7c8798}.lang{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#eef2f7;color:#526176;font-size:10px;font-weight:700}footer{text-align:center;color:#7b8494;padding:26px;font-size:12px}@media(max-width:900px){.nav{padding:12px 0;align-items:flex-start;flex-direction:column}.menu{width:100%}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="w nav"><div class="brand">HUROM <span>Electronics Weekly</span></div><nav class="menu"><button class="active" data-f="ALL">Weekly</button><button data-f="MOTOR">Motor</button><button data-f="CIRCUIT">Circuit</button><button data-f="PCB">PCB Artwork</button><button data-f="SMPS">SMPS</button><button data-f="EMI">EMI</button><button data-f="FIRMWARE">Firmware</button></nav></div></header><div class="hero"><div class="w"><div>APPLIANCE · CIRCUIT · MOTOR · PCB · SMPS · EMI · FIRMWARE</div><h1>전장 엔지니어를 위한<br>한 주의 기술 브리핑</h1><p>기사 제목, 실제 핵심 내용 요약, 주요 기술 키워드를 중심으로 정리합니다.</p><div class="chips"><span class="chip" id="issue">TOP 30</span><span class="chip" id="ud">업데이트 확인 중</span><span class="chip" id="cnt">0건</span></div></div></div><section><div class="w"><div class="head"><h2 id="st">이번 주 전체 기술</h2><small>제목 → 기사 핵심 요약 → 주요 키워드</small></div><div class="grid" id="cards"><div class="empty">불러오는 중</div></div></div></section><footer>HUROM Electronics Weekly</footer><script>let I=[];const L={ALL:'이번 주 전체 기술',MOTOR:'Motor Control',CIRCUIT:'Circuit Design',PCB:'PCB Artwork / Altium',SMPS:'SMPS Design',EMI:'EMI / EMC',FIRMWARE:'MCU Firmware'};const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function r(f){let a=f==='ALL'?I:I.filter(x=>x.category===f);st.textContent=L[f]||f;cnt.textContent=a.length+'건';cards.innerHTML=a.length?a.map(x=>`<article class="card"><span class="tag">${e(x.category)}</span><span class="rating">${'★'.repeat(+x.rating||3)}</span><h3>${e(x.title)}</h3><div class="meta">${e(x.source)} · ${e((x.published||'').slice(0,10))} · <span class="sourceType">${e(x.sourceType||'')}</span><span class="lang">${x.languageGroup==='GLOBAL'?'EN':'KO'}</span></div><div class="summary">${e(x.summary||'')}</div><div class="keywords">${(x.keywords||[]).map(k=>`<span class="kw">#${e(k)}</span>`).join('')}</div><a href="${e(x.url)}" target="_blank" rel="noopener noreferrer">원문 보기 →</a></article>`).join(''):'<div class="empty">자료 없음</div>'}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');r(b.dataset.f)});fetch('./data/weekly.json?'+Date.now()).then(x=>x.json()).then(d=>{I=d.items||[];issue.textContent=d.issueTitle||'TOP '+I.length;ud.textContent='업데이트 '+(d.updated||'').slice(0,10);r('ALL')})</script></body></html>
