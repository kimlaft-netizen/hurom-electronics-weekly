<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUROM Electronics Weekly</title><style>:root{--n:#183b27;--b:#242424;--bg:#f3f7eb;--i:#1f1f1f;--m:#666666}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--i);font-family:Arial,"Noto Sans KR",sans-serif}.w{max-width:1200px;margin:auto;padding:0 22px}header{position:sticky;top:0;z-index:9;background:var(--n);color:#fff}.nav{min-height:64px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;color:inherit;text-decoration:none;display:inline-block}.brand span{color:#f2f5eb}.menu{display:flex;gap:5px;overflow:auto}.menu button{border:0;background:transparent;color:#d8e2f0;padding:10px;border-radius:8px;font-weight:700;white-space:nowrap;cursor:pointer}.menu button.active{background:#ffffff18;color:#fff}.hero{background:linear-gradient(120deg,#173e27 0%,#326638 56%,#5c8133 100%);color:#fff;padding:48px 0}.hero h1{font-size:clamp(14px,3.7vw,50px);letter-spacing:-.045em;white-space:nowrap;margin:8px 0}.hero h1 small{font-size:50%;letter-spacing:0}.hero p{color:#d9e4f0}.chips{display:flex;gap:8px;margin-top:18px}.chip{border:1px solid #ffffff38;border-radius:999px;padding:7px 11px;font-size:12px}section{padding:35px 0}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e1ead8;border-radius:18px;padding:21px;box-shadow:0 5px 20px #2d4a1b18}.tag{display:inline-block;background:#edf5d8;color:#242424;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:850}.rating{float:right;color:#df9700}.card h3{font-size:18px;line-height:1.42;margin:13px 0 8px}.meta{font-size:12px;color:#666666}.summary{color:#303030;font-size:14px;line-height:1.65;margin:15px 0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:6;line-clamp:6;overflow:hidden}.keywords{display:flex;gap:6px;flex-wrap:wrap;margin:13px 0 17px}.kw{background:#f1f6e7;color:#242424;border:1px solid #dce9c4;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:700}.card a{color:var(--b);font-size:13px;font-weight:750}.empty{grid-column:1/-1;background:#fff;padding:30px;text-align:center}.sourceType{color:#666666}.lang{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;background:#edf3e4;color:#333333;font-size:10px;font-weight:700}footer{text-align:center;color:#666666;padding:26px;font-size:12px}@media(max-width:900px){.nav{padding:12px 0;align-items:flex-start;flex-direction:column}.menu{width:100%}.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}.archive-week{margin:0;border-bottom:1px solid #dce5d1}.archive-week details>summary{list-style:none;cursor:pointer;padding:16px 0;font-size:16px;font-weight:750;color:#242424;display:flex;align-items:center;justify-content:space-between}.archive-week details>summary::-webkit-details-marker{display:none}.archive-week details>summary:after{content:"상세보기 +";font-size:13px;color:#42643a;font-weight:700}.archive-week details[open]>summary:after{content:"접기 −"}.archive-week .grid{padding:0 0 20px}.secret-trigger{appearance:none;font:inherit;color:inherit;background:transparent;border:0;padding:0;cursor:default}</style></head><body><header><div class="w nav"><a class="brand" href="./" aria-label="HUROM Electronics Weekly 메인으로">HUROM <span>Electronics Weekly</span></a><nav class="menu"><button class="active" data-f="ALL">Weekly</button><button data-f="MOTOR">Motor</button><button data-f="CIRCUIT">Circuit</button><button data-f="COMPONENTS">Components</button><button data-f="AI">AI</button><button data-f="PCB">PCB Artwork</button><button data-f="SMPS">SMPS</button><button data-f="EMI">EMI</button><button data-f="FIRMWARE">Firmware</button></nav></div></header><div class="hero"><div class="w"><h1>주간 전장·제어 기술 동향 브리핑 <small>(매주 월요일 8시 업데이트)</small></h1><div class="chips"><span class="chip" id="issue">TOP 30</span><span class="chip" id="ud">업데이트 확인 중</span><span class="chip" id="cnt">0건</span></div></div></div><section><div class="w"><div class="head"><h2 id="st">This Week in Technology</h2></div><div class="grid" id="cards"><div class="empty">불러오는 중</div></div></div></section><section id="archiveSection" hidden><div class="w"><div class="head"><h2>Previous Weeks</h2></div><div id="archiveWeeks"></div></div></section><footer>HUROM Electronics Weekly, Made by 휴롬R&amp;D본부 전장<button type="button" class="secret-trigger" id="manualUpdate" aria-label="주간 자료 수동 업데이트">제</button>어팀</footer><script>let I=[],H=[];const L={ALL:'This Week in Technology',MOTOR:'Motor Control',CIRCUIT:'Circuit Design',PCB:'PCB Artwork / Altium',SMPS:'SMPS Design',EMI:'EMI / EMC',FIRMWARE:'MCU Firmware',COMPONENTS:'Components · Interfaces',AI:'AI · Smart Appliances'};const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fixCategory(x){let t=String(x.originalTitle||x.title||'').toLowerCase();if(/반도체|semiconductor|chipset|\bchip\b|\bdram\b|\bnand\b|\bmemory\b|\bipm\b|\bigbt\b|power module|전력모듈|칩셋/i.test(t))x.category='COMPONENTS';else if(x.category==='SMPS'&&/(?:emi|emc)[\s\-_/]*(?:filter|필터)|(?:filter|필터)[\s\-_/]*(?:emi|emc)/i.test(t))x.category='EMI';return x}function good(x){let v=String(x.summary||'').trim(),t=String(x.title||'').trim(),n=z=>z.toLowerCase().replace(/[^a-z0-9가-힣]/g,'');v=v.replace(/\s*(?:\||｜|[-–—])\s*(?:에이빙|aving)\s*$/i,'').trim();let o=String(x.source||'').trim();if(o&&v.toLowerCase().endsWith(o.toLowerCase()))v=v.slice(0,-o.length).replace(/[\s|｜:：\-–—·]+$/,'').trim();if(t&&n(v).startsWith(n(t)))v=v.slice(t.length).replace(/^[\s|｜:：\-–—·…\"'“”]+/,'').trim();x.summary=v;return !!v&&n(v)!==n(t)&&!v.startsWith('본문 미리보기를 가져오지 못했습니다')}function card(x){return '<article class="card"><span class="tag">'+e(x.category)+'</span><span class="rating">'+('★'.repeat(+x.rating||1))+'</span><h3>'+e(x.title)+'</h3><div class="meta">'+e(x.source)+' · '+e((x.published||'').slice(0,10))+' · <span class="sourceType">'+e(x.sourceType||'')+'</span><span class="lang">'+(x.languageGroup==='GLOBAL'?'EN':'KO')+'</span></div><div class="summary">'+e(x.summary||'')+'</div><div class="keywords">'+(x.keywords||[]).map(k=>'<span class="kw">#'+e(k)+'</span>').join('')+'</div><a href="'+e(x.url)+'" target="_blank" rel="noopener noreferrer">원문 보기 →</a></article>'}function r(f){let a=(f==='ALL'?I:I.filter(x=>x.category===f)).slice().sort((x,y)=>(+y.rating||1)-(+x.rating||1)||String(y.published||'').localeCompare(String(x.published||'')));st.textContent=L[f]||f;cnt.textContent=a.length+'건';cards.innerHTML=a.length?a.map(card).join(''):'<div class="empty">자료 없음</div>';let past=H.map(w=>({...w,items:(w.items||[]).filter(x=>f==='ALL'||x.category===f)})).filter(w=>w.items.length);archiveSection.hidden=!past.length;archiveWeeks.innerHTML=past.map(w=>'<div class="archive-week"><details><summary>'+e(w.week)+' · '+w.items.length+'건</summary><div class="grid">'+w.items.map(card).join('')+'</div></details></div>').join('')}document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-f]').forEach(x=>x.classList.remove('active'));b.classList.add('active');r(b.dataset.f)});document.getElementById('manualUpdate').addEventListener('click',async()=>{if(!window.confirm('주간 자료 업데이트를 지금 실행하시겠습니까?'))return;const password=window.prompt('업데이트 승인 암호를 입력하세요.');if(password===null)return;try{const response=await fetch('/api/trigger-update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})});const result=await response.json().catch(()=>({}));if(!response.ok)throw new Error(result.error||'요청 실패');window.alert('업데이트를 요청했습니다. GitHub Actions에서 진행 상태를 확인할 수 있습니다.')}catch(error){window.alert('업데이트 요청에 실패했습니다: '+error.message)}});Promise.all([fetch('./data/weekly.json?'+Date.now()).then(x=>x.json()),fetch('./data/archive.json?'+Date.now()).then(x=>x.ok?x.json():{weeks:[]}).catch(()=>({weeks:[]}))]).then(([d,h])=>{I=(d.items||[]).map(fixCategory).filter(good);H=(h.weeks||[]).map(w=>({...w,items:(w.items||[]).map(fixCategory).filter(good)}));issue.textContent='전장 기술 TOP '+I.length;ud.textContent='업데이트 '+(d.updated||'').slice(0,10);r('ALL')})</script></body></html>
